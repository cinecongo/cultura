# Configuration gitleaks — Cultura
# Étend la règles par défaut, puis exclut les fichiers binaires ou volumineux
# qui ne peuvent pas contenir de secret exploitable.

[extend]
useDefault = true

[allowlist]
description = "Binaires et médias exclus du scan"
paths = [
  '''CULTURA_MEDIA_GUIDE_v1\.0\.docx''',
  '''brand/.*\.png''',
  '''.*\.jpg''',
  '''.*\.docx''',
]
